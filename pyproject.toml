[project]
name = "node-tc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rongzhiwei", email = "18845728185@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    # 这里的版本号要包含 dev 标识，以便 uv 匹配到 whl
    "torch==2.7.0.dev20250220", 
    "torchdiffeq>=0.2.5",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
]
[tool.uv]
# 核心改动：告诉 uv 只解析 Windows 平台，忽略 Linux/macOS 的依赖路径
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
# 明确这个 URL 只用于 Windows
torch = { url = "https://download.pytorch.org/whl/nightly/cu128/torch-2.7.0.dev20250220%2Bcu128-cp312-cp312-win_amd64.whl" }